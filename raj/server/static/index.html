<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAJ Finance Agent</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#17202a;--muted:#5d6b7a;--line:#dde3ea;--accent:#0b6e4f;--accent-ink:#fff;--warn:#9a6700;--bad:#b42318;--good:#067647;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--panel:#161d23;--ink:#e6edf3;--muted:#9aa7b4;--line:#26313b;--accent:#2fb489;--accent-ink:#06130e;--warn:#e3b341;--bad:#f97066;--good:#47cd89;--chip:#1e2830}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 8px 0 0}header .ctx{font-size:13px;color:var(--muted)}header .ctx b{color:var(--ink)}
.spacer{flex:1}main{max-width:1200px;margin:0 auto;padding:16px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}nav button{background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}.card h3{font-size:14px;margin:14px 0 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:64px}label{display:inline-flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);margin:0 8px 8px 0}
button.p,button.s{font:inherit;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid var(--accent)}
button.p{background:var(--accent);color:var(--accent-ink)}button.s{background:none;color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.tbl{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--chip);white-space:nowrap}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.chips button{background:var(--chip);border:0;border-radius:12px;padding:3px 10px;margin:0 6px 6px 0;cursor:pointer;font:inherit;font-size:12px;color:var(--ink)}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.status div{border:1px solid var(--line);border-radius:6px;padding:8px}.status div b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.totals{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}.totals div{font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;background:var(--chip);padding:8px;border-radius:6px;font-size:12px}
.err{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);padding:8px;border-radius:6px;margin:8px 0}
.answer{font-size:15px;margin:4px 0 10px}details summary{cursor:pointer;color:var(--muted)}
#login{max-width:360px;margin:12vh auto}
@media (max-width:640px){main{padding:12px}header{padding:8px 12px;position:static}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/app.js"></script>
</body>
</html>

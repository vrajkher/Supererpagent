[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raj-finance-agent"
version = "0.1.0"
description = "RAJ Finance Agent: Tally connector, firm portal and finance agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42", "pydantic>=2.6",
  "python-multipart>=0.0.9", "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Client connector: RAJTALLYFINLMCP as the Tally adapter (pinned commit; bump deliberately)
tally = ["rajtally-mcp @ git+https://github.com/vrajkher/RAJTALLYFINLMCP@ea55323a15a3244f44552242ca39e98d29eb64dc"]
# Firm server: DeepSeek Harness runtime for the finance agent (developer preview: exact pin)
agent = ["deepseek-harness-sdk==0.2.1rc2", "mcp>=2.3"]

[project.scripts]
raj-server = "raj.server.app:main"
raj-connector = "raj.connector.cli:main"
raj-fake-tally = "raj.tally.fake_server:main"
raj-demo = "raj.demo:main"

[tool.setuptools.packages.find]
include = ["raj*"]

[tool.setuptools.package-data]
"raj.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
filterwarnings = ["ignore::DeprecationWarning"]

# /etc/ssh/sshd_config.d/50-raj-tunnel.conf
# Restricted account used ONLY for client-initiated reverse forwards to each client's RAJ gateway.
# VERIFY on the pinned OpenSSH version with infra/ssh/verify-restrictions.sh before go-live.
Match User rajtunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    # One line per active device, generated from the RAJ database (revocation is immediate for new logins):
    AuthorizedKeysCommand /opt/raj/infra/ssh/raj-authorized-keys %u
    AuthorizedKeysCommandUser raj-keys
    AllowTcpForwarding remote
    GatewayPorts no
    PermitListen none          # overridden per key by permitlisten="127.0.0.1:<port>" (key options are authoritative)
    PermitOpen none
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
    ClientAliveInterval 30
    ClientAliveCountMax 3

# /etc/ssh/sshd_config.d/50-raj-tunnel.conf
# Restricted account used ONLY for client-initiated reverse forwards to each client's RAJ gateway.
# Verified against OpenSSH 9.6 by infra/ssh/ci-sshd-test.sh (CI job sshd-integration); re-run on your version.
Match User rajtunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    # One line per active device, generated from the RAJ database (revocation is immediate for new logins):
    # sshd runs this as root-checked code: it and every parent directory must be root-owned and not
    # group/world-writable, so it is installed to /usr/local/lib/raj, never run from the service checkout.
    AuthorizedKeysCommand /usr/local/lib/raj/raj-authorized-keys %u /var/lib/raj/server/raj.sqlite3
    AuthorizedKeysCommandUser raj-keys
    AllowTcpForwarding remote
    GatewayPorts no
    # R2: the administrative list must ADMIT loopback listeners; a key's permitlisten="127.0.0.1:<port>"
    # can only narrow it further, never widen it (with "none" here every forward was refused).
    PermitListen 127.0.0.1:* localhost:*
    PermitOpen none
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
    ClientAliveInterval 30
    ClientAliveCountMax 3
